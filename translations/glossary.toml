# 术语表 —— 注入翻译 prompt，强制固定译法。
#
# 左边是中文写法，右边是英文里必须出现的写法。只放「模型会译错或译歪」的词：
# 通用词不用列，列多了会稀释 prompt 的注意力。
#
# 改了这里 → 下次 CI 会把受影响的块重翻（因为 glossary 版本号参与缓存 key）。
# 只想钉死某一句的译法，改 i18n/cache/issue-N.json 里对应 hash 的 value 更直接。

